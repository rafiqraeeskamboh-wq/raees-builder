<script>
/* load and compile the app files in order */
(function () {
var V = "?v=32";
var FILES = [
"app/rb2-core.jsx", "app/rb2-tabs.jsx", "app/rb2-app.jsx"
];
function fail(f, msg) {
var host = document.getElementById("rb-root");
if (host) host.innerHTML = "<div class=\"rb-loading\">App error: " + f + "<br>" + msg + "</div>";
}
function step(i) {
if (i >= FILES.length) return;
var f = FILES[i];
fetch(f + V).then(function (r) {
if (!r.ok) throw new Error("HTTP " + r.status);
return r.text();
}).then(function (src) {
var code = Babel.transform(src, { presets: ["react"], sourceType: "script" }).code;
var s = document.createElement("script");
s.textContent = code;
document.body.appendChild(s);
step(i + 1);
}).catch(function (e) { fail(f, e.message); });
}
if (window.Babel) { step(0); } else { fail("babel", "not loaded"); }
})();
</script>
