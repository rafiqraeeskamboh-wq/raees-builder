<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline | Raees Builder</title>
<meta name="theme-color" content="#f26522">
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{--orange:#f26522;--ink:#22262b;--muted:#6b7280}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:var(--ink);background:#f7f8fa;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .box{max-width:420px;background:#fff;border:1px solid #e7e9ec;border-radius:16px;padding:36px 28px;
       box-shadow:0 10px 30px rgba(34,38,43,.08)}
  img{width:120px;margin:0 auto 18px}
  h1{font-size:24px;font-weight:800;margin-bottom:10px}
  p{color:var(--muted);margin-bottom:8px;line-height:1.6}
  .urdu{direction:rtl;font-size:15px;margin-bottom:22px}
  a.btn{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-weight:700;
        padding:12px 22px;border-radius:999px}
  a.tel{display:block;margin-top:16px;color:var(--orange);text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <img src="logo.png" alt="Raees Builder">
    <h1>You are offline</h1>
    <p>The Raees Builder app cannot reach the internet right now. Reconnect and try again.</p>
    <p class="urdu">انٹرنیٹ کنکشن دستیاب نہیں ہے۔ دوبارہ کوشش کریں۔</p>
    <a class="btn" href="./index.html">Try again</a>
    <a class="tel" href="tel:+923001234567">Or call us: +92 300 1234567</a>
  </div>
</body>
</html>
